<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050504" />
  <meta name="color-scheme" content="dark" />
  <title>Liberty</title>
  <meta name="description" content="The Room." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 class="sr-only">Liberty</h1>

  <div class="space" id="space">
    <div class="look" id="look">
      <div class="wall" data-depth="0.22"></div>
      <div class="door" data-depth="0.28" aria-hidden="true"></div>
      <div class="floor" data-depth="0.45"></div>
      <div class="lamp" data-depth="0.7">
        <span class="cord"></span>
        <span class="cap"></span>
        <span class="bulb"></span>
        <span class="halo"></span>
        <span class="cone"></span>
      </div>
    </div>
    <div class="vignette"></div>
    <p class="mark">Liberty</p>
  </div>

  <script src="room.js"></script>
</body>
</html>
